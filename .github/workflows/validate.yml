name: Validate Estúdio Luz e Cor V2

on:
  push:
    branches:
      - mp-checkout-backend-prep
      - ai-sales-assistant-prep
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: curl, pdo_sqlite
          coverage: none

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: PHP syntax checks
        run: |
          find api tests -type f -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: PHP smoke tests
        run: php tests/php-smoke.php
          
      - name: Assistant smoke tests
        run: php tests/assistant-smoke.php

      - name: JavaScript syntax checks
        run: |
          node --check script-v2.js
          node --check catalog-data-v2.js

      - name: Catalog and frontend smoke tests
        run: node tests/catalog-smoke.cjs
